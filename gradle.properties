android.useAndroidX=true
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Do not pin Android Studio's bundled JBR: current Studio ships Java 25,
# and this repo's Gradle 8.5 only supports Java 8–21. Let the IDE Gradle JDK
# setting (or JAVA_HOME) choose 17 or 21.
# org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

# Suppress AGP warning until we upgrade to a version tested with compileSdk 35
android.suppressUnsupportedCompileSdk=35
